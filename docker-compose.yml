services:
  database:
    image: postgis/postgis
    build:
      context: https://github.com/postgis/docker-postgis.git#master:18-3.6
    environment:
      - POSTGRES_USER=districtbuilder
      - POSTGRES_PASSWORD=districtbuilder
      - POSTGRES_DB=districtbuilder
    healthcheck:
      test: pg_isready -q -h database -U districtbuilder
      interval: 3s
      timeout: 3s
      retries: 3
      start_period: 5s

  server:
    image: districtbuilder
    env_file: src/server/.env
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=districtbuilder
      - POSTGRES_PASSWORD=districtbuilder
      - POSTGRES_DB=districtbuilder
      - TYPEORM_HEALTH_CHECK_TIMEOUT=3000
      - NODE_ENV=Development
      - NODE_OPTIONS=--max-old-space-size=16384
      - AWS_PROFILE=${AWS_PROFILE:-district-builder}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # UUID project IDs make it safe for dev and prod to share one bucket.
      # Override locally if you want isolation.
      - THUMBNAILS_BUCKET=${THUMBNAILS_BUCKET:-districtbuilder-production-thumbnails}
      - REGION_ARTIFACTS_BUCKET=${REGION_ARTIFACTS_BUCKET:-districtbuilder-dev-238046523378}
      - JWT_SECRET=insecure
      - JWT_EXPIRATION_IN_MS=604800000 # 1 week
      - CLIENT_URL=http://localhost:3003
    build:
      context: ./src/server
      dockerfile: Dockerfile
    volumes:
      - ./src/server:/home/node/app/server
      - ./src/shared:/home/node/app/shared
      - server-node-modules:/home/node/app/server/node_modules
      - yarn-cache:/usr/local/share/.cache/yarn
      - $HOME/.aws:/root/.aws:ro
    working_dir: /home/node/app/server
    depends_on:
      database:
        condition: service_healthy
    command: start:dev
    mem_limit: 12g

  client:
    image:  node:24-bookworm-slim
    environment:
      - BASE_URL=${BASE_URL:-http://server:3005}
      - THUMBNAILS_ORIGIN=${THUMBNAILS_ORIGIN:-https://districtbuilder-production-thumbnails.s3.us-east-1.amazonaws.com}
      - VITE_RUM_APP_MONITOR_ID=${VITE_RUM_APP_MONITOR_ID:-}
      - VITE_RUM_GUEST_ROLE_ARN=${VITE_RUM_GUEST_ROLE_ARN:-}
      - VITE_RUM_IDENTITY_POOL_ID=${VITE_RUM_IDENTITY_POOL_ID:-}
      - VITE_RUM_REGION=${VITE_RUM_REGION:-us-east-1}
    volumes:
      - ./:/home/node/app
      - ./src/server/dist/server/src/static:/home/node/app/build
      - client-node-modules:/home/node/app/node_modules
      - yarn-cache:/usr/local/share/.cache/yarn
    working_dir: /home/node/app
    command: yarn dev

  # Standalone Chromium exposing CDP on port 3000, used by manage commands
  # that need to rasterize HTML (backfill-thumbnails). Started on-demand when
  # manage depends on it; `./scripts/manage` pulls this up automatically.
  chromium:
    image: ghcr.io/browserless/chromium:latest
    environment:
      - CONCURRENT=1
      - TIMEOUT=120000
      # Advertised hostname in CDP target URLs. Default is 0.0.0.0, which
      # other containers on the docker network can't dial; set to the
      # service name so puppeteer can follow the returned URLs.
      - HOST=chromium

  manage:
    image: districtbuilder-manage
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - POSTGRES_USER=districtbuilder
      - POSTGRES_PASSWORD=districtbuilder
      - POSTGRES_DB=districtbuilder
      - AWS_PROFILE=${AWS_PROFILE:-district-builder}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - THUMBNAILS_BUCKET=${THUMBNAILS_BUCKET:-districtbuilder-production-thumbnails}
      - REGION_ARTIFACTS_BUCKET=${REGION_ARTIFACTS_BUCKET:-districtbuilder-dev-238046523378}
      # Reaches the chromium sidecar on the internal docker network.
      - PUPPETEER_BROWSER_URL=${PUPPETEER_BROWSER_URL:-http://chromium:3000}
      - NODE_OPTIONS=--max-old-space-size=24384
    build:
      context: ./src/manage
      dockerfile: Dockerfile
    volumes:
      - ./src/server:/home/node/app/server
      - ./src/shared:/home/node/app/shared
      - ./src/manage:/home/node/app/manage
      - server-node-modules:/home/node/app/server/node_modules
      - manage-node-modules:/home/node/app/manage/node_modules
      - yarn-cache:/usr/local/share/.cache/yarn
      - $HOME/.aws:/root/.aws:ro
    working_dir: /home/node/app/manage
    depends_on:
      database:
        condition: service_healthy
    command: bash

volumes:
  server-node-modules:
  client-node-modules:
  manage-node-modules:
  yarn-cache:
